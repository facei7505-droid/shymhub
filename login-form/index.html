<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Shymkent</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>
  <div class="overlay"></div>
  
  <div class="container">
    <div class="form-wrapper" id="formWrapper">
      <div class="form-card" id="loginForm">
        <h2>Вход</h2>
        <form onsubmit="return handleLogin(event)">
          <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <span class="input-border"></span>
          </div>
          <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <span class="input-border"></span>
          </div>
          <button type="submit" class="btn btn-primary">Войти</button>
          <p class="switch-text">
            Нет аккаунта? <a href="#" onclick="showRegister(event)">Зарегистрироваться</a>
          </p>
        </form>
      </div>

      <div class="form-card hidden" id="registerForm">
        <h2>Регистрация</h2>
        <form onsubmit="return handleRegister(event)">
          <div class="input-group">
            <input type="text" id="regName" placeholder="Имя" required>
            <span class="input-border"></span>
          </div>
          <div class="input-group">
            <input type="email" id="regEmail" placeholder="Email" required>
            <span class="input-border"></span>
          </div>
          <div class="input-group">
            <input type="password" id="regPassword" placeholder="Пароль" required>
            <span class="input-border"></span>
          </div>
          <div class="input-group">
            <input type="password" id="regConfirm" placeholder="Подтвердите пароль" required>
            <span class="input-border"></span>
          </div>
          <button type="submit" class="btn btn-primary">Создать аккаунт</button>
          <p class="switch-text">
            Уже есть аккаунт? <a href="#" onclick="showLogin(event)">Войти</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
